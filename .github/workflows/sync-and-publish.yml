name: Sync upstream and publish image

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: sync-and-publish
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: HITZY2002/codearts2api
  UPSTREAM_BRANCH: main
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/codearts2api

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            for file in .github/workflows/sync-and-publish.yml docker-compose.yml; do
              if git status --short -- "$file" | grep -q .; then
                git checkout --ours -- "$file"
                git add "$file"
              fi
            done
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo 'Unresolved upstream merge conflicts remain.' >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
            git -c core.editor=true merge --continue
          fi

          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout synced source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ needs.sync.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
